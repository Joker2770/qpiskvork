name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: features

      # Base dependencies required to build the Qt6 app on Linux
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          modules: 'qtmultimedia'
          cache: true

      # The SGF feature on the features branch depends on libsgfcplusplus; build and install it first
      - name: Build libsgfcplusplus
        shell: bash
        run: |
          set -eux
          git clone --depth 1 --branch develop https://github.com/herzbube/libsgfcplusplus.git
          cd libsgfcplusplus
          if [ "$RUNNER_OS" = "Windows" ]; then
            git submodule update --init sgfc win-iconv
          else
            git submodule update --init sgfc
          fi
          cd ..
          if [ "$RUNNER_OS" = "Windows" ]; then
            PREFIX="C:/Program Files (x86)/libsgfc++"
          else
            PREFIX="/usr/local"
          fi
          cmake -S libsgfcplusplus -B libsgfcplusplus/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_SHARED_LIBRARY=YES \
            -DENABLE_STATIC_LIBRARY=NO \
            -DENABLE_SHARED_FRAMEWORK=NO \
            -DENABLE_STATIC_FRAMEWORK=NO \
            -DENABLE_TESTS=NO \
            -DENABLE_EXAMPLES=NO
          cmake --build libsgfcplusplus/build --config Release --parallel
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --install libsgfcplusplus/build --config Release
          else
            sudo cmake --install libsgfcplusplus/build --config Release
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix dist

      # ---------- Linux: AppImage ----------
      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -eux
          # Assemble the AppDir
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/* AppDir/usr/
          sed 's|^Icon=.*|Icon=qpiskvork|' snap/gui/qpiskvork.desktop > AppDir/usr/share/applications/qpiskvork.desktop
          cp snap/gui/qpiskvork.png AppDir/usr/share/icons/hicolor/256x256/apps/qpiskvork.png
          # Download linuxdeploy and its Qt plugin
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # Point to the installed Qt
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          # Generate the AppImage
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage
          mv qpiskvork-*.AppImage "qpiskvork-${{ github.ref_name }}-linux-x86_64.AppImage"

      # ---------- Windows: zip ----------
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          windeployqt --release --no-translations "dist\bin\qpiskvork.exe"
          Copy-Item "C:\Program Files (x86)\libsgfc++\bin\libsgfcplusplus.dll" "dist\bin\"
          Compress-Archive -Path "dist\bin\*" -DestinationPath "qpiskvork-${{ github.ref_name }}-windows-x64.zip"

      # ---------- macOS: dmg ----------
      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          macdeployqt "dist/bin/qpiskvork.app"
          cp /usr/local/lib/libsgfcplusplus.dylib "dist/bin/qpiskvork.app/Contents/Frameworks/"
          install_name_tool -change /usr/local/lib/libsgfcplusplus.dylib @executable_path/../Frameworks/libsgfcplusplus.dylib "dist/bin/qpiskvork.app/Contents/MacOS/qpiskvork"
          codesign --force --sign - "dist/bin/qpiskvork.app"
          hdiutil create -volname qpiskvork -srcfolder "dist/bin/qpiskvork.app" -ov -format UDZO "qpiskvork-${{ github.ref_name }}-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qpiskvork-${{ matrix.name }}
          path: |
            qpiskvork-*.AppImage
            qpiskvork-*.zip
            qpiskvork-*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
