name: qpiskvork # you probably want to 'snapcraft register <name>'
version: '0.10.10' # just for humans, typically '1.2+git' or '1.3.2'
summary: Another gomoku or renju manager adapting to Windows and Linux systems. # 79 char long summary
description: |
  This program aims to become a gomoku or renju manager with the protocol
  (https://plastovicka.github.io/protocl2en.htm).

  * Support many rules(Free-style/Standard gomoku, renju, caro, swap2 etc.).
  * Support many AI engines such as AIWine, embryo, Z2I, Rapfi, Yixin etc.
  * Wonderful GUI for human-computer interaction.

  **For loading engines successfully, the steps as follow is necessary. **

     sudo snap connect qpiskvork:system-observe
     sudo snap connect qpiskvork:system-trace
     sudo snap connect qpiskvork:process-control

  _More details: https://github.com/Joker2770/qpiskvork.git_

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
base: core22
license: 'GPL-2.0-or-later'
title: qpiskvork
contact: yjt950840@outlook.com
issues: https://github.com/Joker2770/qpiskvork/issues
source-code: https://github.com/Joker2770/qpiskvork
website: https://github.com/Joker2770/qpiskvork

layout:
  /etc/fonts:
    bind: $SNAP/etc/fonts
  /usr/local/lib:
    bind: $SNAP/usr/local/lib
  /usr/local/share:
    bind: $SNAP/usr/local/share
  /usr/share/X11:
    bind: $SNAP/usr/share/X11
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/alsa-lib:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/alsa-lib

apps:
  qpiskvork:
    command-chain: ["snap/command-chain/alsa-launch"]
    command: usr/local/bin/qpiskvork
    plugs:
      - home
      - desktop
      - desktop-legacy
      - audio-playback
      - alsa
      - unity7
      - x11
      - opengl
      - removable-media
      - gsettings
      - network
      - process-control
      - system-observe
      - system-trace
    environment:
      LD_LIBRARY_PATH: "$LD_LIBRARY_PATH:$SNAP/usr/local/lib:$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/pulseaudio"
      QT_PLUGIN_PATH: "$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/qt5/plugins"
      GST_PLUGIN_PATH: "$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/gstreamer-1.0"
      XDG_DATA_DIRS: $SNAP/share:$XDG_DATA_DIRS
      QT_QPA_PLATFORM: xcb

parts:
  libsgfcplusplus:
    plugin: cmake
    cmake-parameters:
      - "-DCMAKE_INSTALL_PREFIX=/usr/local"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DCMAKE_C_COMPILER=/usr/bin/gcc"
      - "-DCMAKE_CXX_COMPILER=/usr/bin/g++"
      - "-DENABLE_SHARED_LIBRARY=YES"
      - "-DENABLE_STATIC_LIBRARY=NO"
      - "-DENABLE_SHARED_FRAMEWORK=NO"
      - "-DENABLE_STATIC_FRAMEWORK=NO"
      - "-DENABLE_TESTS=NO"
      - "-DENABLE_EXAMPLES=NO"
    source: https://github.com/herzbube/libsgfcplusplus.git
    source-type: git
    source-branch: develop
    source-depth: 1
    build-packages:
      - gcc
      - g++
      - make
      - cmake

  qpiskvork:
    after: [libsgfcplusplus, alsa-mixin]
    plugin: cmake
    cmake-parameters:
      - "-DCMAKE_INSTALL_PREFIX=/usr/local"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DENABLE_TESTING=OFF"
      - "-DBUILD_TESTING=OFF"
    source: https://github.com/Joker2770/qpiskvork.git
    source-type: git
    source-branch: features
    source-depth: 1
    source-submodules: []
    build-packages:
      - gcc
      - g++
      - make
      - qtbase5-dev
      - qtmultimedia5-dev
    stage-packages:
      - libqt5core5a
      - libqt5gui5
      - libqt5widgets5
      - libqt5svg5
      - libqt5multimedia5
      - libqt5multimediawidgets5
      - libqt5multimedia5-plugins
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio
      - libpulse0
      - libxcb-cursor0
      - libxkbcommon0
      - xkb-data
      - fontconfig
      - fonts-dejavu-core

  alsa-mixin:
    plugin: dump
    source: https://github.com/diddlesnaps/snapcraft-alsa.git
    source-subdir: snapcraft-assets
    build-packages:
      - libasound2-dev
    # Note: do NOT stage `yad` here. yad is a GTK3 dialog helper that the
    # alsa-launch script only uses when the app ships a GTK runtime. qpiskvork
    # is a Qt app and GTK3 is not staged, so a staged yad would crash with
    # "libgtk-3.so.0: cannot open shared object file". Without yad the script
    # falls back to its built-in text prompt / "use PulseAudio" path.
    stage-packages:
      - libasound2
      - libasound2-plugins
    stage:
      - etc/asound.conf
      - snap/command-chain/alsa-launch
      - usr/lib/$SNAPCRAFT_ARCH_TRIPLET/alsa-lib
      - usr/lib/$SNAPCRAFT_ARCH_TRIPLET/libasound*
