name: qpiskvork # you probably want to 'snapcraft register <name>'
version: '0.10.10' # just for humans, typically '1.2+git' or '1.3.2'
summary: Another gomoku or renju manager adapting to Windows and Linux systems. # 79 char long summary
description: |
  This program aims to become a gomoku or renju manager with the protocol
  (https://plastovicka.github.io/protocl2en.htm).

  * Support many rules(Free-style/Standard gomoku, renju, caro, swap2 etc.).
  * Support many AI engines such as AIWine, embryo, Z2I, Rapfi, Yixin etc.
  * Wonderful GUI for human-computer interaction.

  **For loading engines successfully, the steps as follow is necessary. **

     sudo snap connect qpiskvork:system-observe
     sudo snap connect qpiskvork:system-trace
     sudo snap connect qpiskvork:process-control

  _More details: https://github.com/Joker2770/qpiskvork.git_

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
base: core22
license: 'GPL-2.0-or-later'
title: qpiskvork
contact: yjt950840@outlook.com
issues: https://github.com/Joker2770/qpiskvork/issues
source-code: https://github.com/Joker2770/qpiskvork
website: https://github.com/Joker2770/qpiskvork

layout:
  /etc/fonts:
    bind: $SNAP/etc/fonts
  /usr/local/lib:
    bind: $SNAP/usr/local/lib
  /usr/local/share:
    bind: $SNAP/usr/local/share
  /usr/share/X11:
    bind: $SNAP/usr/share/X11
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/alsa-lib:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/alsa-lib

apps:
  qpiskvork:
    command-chain: ["snap/command-chain/alsa-launch"]
    command: usr/local/bin/qpiskvork
    plugs:
      - home
      - desktop
      - desktop-legacy
      - audio-playback
      - alsa
      - unity7
      - x11
      - opengl
      - removable-media
      - gsettings
      - network
      - process-control
      - pulseaudio
      - system-observe
      - system-trace
    environment:
      LD_LIBRARY_PATH: "$LD_LIBRARY_PATH:$SNAP/usr/local/lib:$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/pulseaudio"
      QT_PLUGIN_PATH: "$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/qt5/plugins"
      GST_PLUGIN_PATH: "$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/gstreamer-1.0"
      XDG_DATA_DIRS: $SNAP/share:$SNAP/usr/share:$XDG_DATA_DIRS
      # Let gdk-pixbuf (used by yad's dialog) find its image loaders in the snap
      GDK_PIXBUF_MODULEDIR: "$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/gdk-pixbuf-2.0/2.10.0/loaders"
      QT_QPA_PLATFORM: xcb

parts:
  libsgfcplusplus:
    plugin: cmake
    cmake-parameters:
      - "-DCMAKE_INSTALL_PREFIX=/usr/local"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DCMAKE_C_COMPILER=/usr/bin/gcc"
      - "-DCMAKE_CXX_COMPILER=/usr/bin/g++"
      - "-DENABLE_SHARED_LIBRARY=YES"
      - "-DENABLE_STATIC_LIBRARY=NO"
      - "-DENABLE_SHARED_FRAMEWORK=NO"
      - "-DENABLE_STATIC_FRAMEWORK=NO"
      - "-DENABLE_TESTS=NO"
      - "-DENABLE_EXAMPLES=NO"
    source: https://github.com/herzbube/libsgfcplusplus.git
    source-type: git
    source-branch: develop
    source-depth: 1
    build-packages:
      - gcc
      - g++
      - make
      - cmake

  qpiskvork:
    after: [libsgfcplusplus, alsa-mixin]
    plugin: cmake
    cmake-parameters:
      - "-DCMAKE_INSTALL_PREFIX=/usr/local"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DENABLE_TESTING=OFF"
      - "-DBUILD_TESTING=OFF"
    source: https://github.com/Joker2770/qpiskvork.git
    source-type: git
    source-branch: features
    source-depth: 1
    source-submodules: []
    build-packages:
      - gcc
      - g++
      - make
      - qtbase5-dev
      - qtmultimedia5-dev
    stage-packages:
      - libqt5core5a
      - libqt5gui5
      - libqt5widgets5
      - libqt5svg5
      - libqt5multimedia5
      - libqt5multimediawidgets5
      - libqt5multimedia5-plugins
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio
      - libpulse0
      - libxcb-cursor0
      - libxkbcommon0
      - xkb-data
      - fontconfig
      - fonts-dejavu-core

  alsa-mixin:
    plugin: dump
    source: https://github.com/diddlesnaps/snapcraft-alsa.git
    source-subdir: snapcraft-assets
    build-packages:
      - libasound2-dev
    # yad is the GTK3 dialog helper used by alsa-launch to ask about the alsa
    # plug / PulseAudio. It must ship its whole GTK3 runtime (shared libs +
    # gdk-pixbuf loaders + icon theme + mime db) or it crashes at runtime with:
    #   yad: error while loading shared libraries: libgtk-3.so.0 ...
    # Note: libpulse0 is already staged by the qpiskvork part below; the
    # pulseaudio override dir used by alsa-launch is still listed in `stage`.
    stage-packages:
      - libasound2
      - libasound2-plugins
      - yad
      - libgtk-3-0
      - libgdk-pixbuf-2.0-0
      - adwaita-icon-theme
      - shared-mime-info
    stage:
      - etc/asound.conf
      - snap/command-chain/alsa-launch
      - usr/bin/yad*
      # ALSA plugin dir + PulseAudio override dir used by alsa-launch
      - usr/lib/$SNAPCRAFT_ARCH_TRIPLET/alsa-lib
      - usr/lib/$SNAPCRAFT_ARCH_TRIPLET/pulseaudio
      # gdk-pixbuf image loaders (needed to render the yad dialog icon)
      - usr/lib/$SNAPCRAFT_ARCH_TRIPLET/gdk-pixbuf-2.0
      # All shared libs pulled in by the stage-packages above: ALSA, PulseAudio
      # and the full GTK3 dependency chain yad needs (glib, gdk-pixbuf, pango,
      # cairo, atk, harfbuzz, fontconfig, X11, wayland, codecs, ...). A broad
      # glob is intentional so a missing .so can never break yad again.
      - usr/lib/$SNAPCRAFT_ARCH_TRIPLET/lib*
      # GTK data: icon theme, mime database, glib schemas
      - usr/share/icons
      - usr/share/mime
      - usr/share/glib-2.0
